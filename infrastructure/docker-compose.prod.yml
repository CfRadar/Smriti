version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: smriti-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - smriti-prod-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smriti-backend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/smriti_prod
      - AI_SERVICE_URL=http://ai:8000
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smriti-prod-net

  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: smriti-ai-prod
    restart: always
    environment:
      - PORT=8000
      - MODEL_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smriti-prod-net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: smriti-web-prod
    restart: always
    environment:
      - VITE_API_BASE_URL=/api
    networks:
      - smriti-prod-net

  mongo:
    image: mongo:6.0
    container_name: smriti-mongo-prod
    restart: always
    volumes:
      - mongo-prod-data:/data/db
    networks:
      - smriti-prod-net

volumes:
  mongo-prod-data:

networks:
  smriti-prod-net:
    driver: bridge
